name: Sync and Convert Rules
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/convert.py'
      - '.github/workflows/sync-rules.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Sync rules
        run: python scripts/convert.py
      - name: Commit changes
        run: |
          git add scripts/.managed-rules.json clash-verge-rev/ruleset/ quantumultx/ruleset/
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: sync and convert rules"
          git push




