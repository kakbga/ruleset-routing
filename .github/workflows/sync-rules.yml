name: Sync Blackmatrix7 rules
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/convert.py'
      - '.github/workflows/sync-rules.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync rules
        run: python scripts/convert.py
      - name: Commit changes
        run: |
          git add clash-verge-rev/ruleset/*.yaml quantumultx/ruleset/*.list
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: sync Blackmatrix7 rules"
          git push

