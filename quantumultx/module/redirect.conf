# ============================================================
# Google 中国域名 → www.google.com 302 跳转
# 适用：Quantumult X 复写资源 / 本地复写配置
# 更新：2026-11-12
# ------------------------------------------------------------
# 规则说明：
#   匹配 http(s)://(www.)?(g|google).cn 及其后的任意路径与参数，
#   302 重定向至 https://www.google.com + 原路径。
#   例：https://www.google.cn/search?q=abc
#    →  https://www.google.com/search?q=abc
# ------------------------------------------------------------
# 用法：QX → 设置 → 复写 → 引用（填本文件地址或本地文件），
#       或把 [rewrite_local] 规则直接贴进主配置对应段落。
# 注意：https 命中需要开启 MitM 并安装、信任 QX 根证书。
# ============================================================

[rewrite_local]

# Google 中国域名 302 → google.com
^https?://(?:www\.)?(?:g|google)\.cn(.*)$ url 302 https://www.google.com$1


[mitm]

# 仅 .cn 域名实际参与 MitM；www.google.com 为跳转目标，
# 正则不会匹配它，此处按需求保留（可删）。
hostname = %APPEND% www.google.com, www.google.cn, google.cn, g.cn, www.g.cn
