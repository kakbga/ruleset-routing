# Quantumult X小白配置 制作 by Orz-3 2026/11/10 更新
[general]
# 配置文件图标
profile_img_url = https://raw.githubusercontent.com/kakbga/ruleset-routing/main/quantumultx/image/20260313.png
# 用于节点延迟测试
server_check_url = http://cp.cloudflare.com/generate_204
# 网络联通性测试地址
network_check_url = http://www.apple.com/library/test/success.html
# 用于设置图标显示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 功能强大的解析器，用于引用资源的转换
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# DNS排除列表
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
# UDP 回退策略
fallback_udp_policy = reject
# 下列路径将不经过 QuanX 的处理
excluded_routes = 239.255.255.250/32
icmp_auto_reply = true
[dns]
no-ipv6
no-system
server=223.5.5.5
server=119.29.29.29
server=/dl.google.com/119.29.29.29
server=/dl.l.google.com/119.29.29.29
server=/update.googleapis.com/119.29.29.29
server=/*.dl.playstation.net/119.29.29.29
;circumvent-ipv4-answer= 
;circumvent-ipv6-answer=
[policy]
static=全球加速, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, 特殊节点, proxy, direct, img-url=https://raw.githubusercontent.com/kakbga/Icon-backup/main/Orz-3/Color/Global.png
static=苹果服务, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, 特殊节点, proxy, direct, img-url=https://raw.githubusercontent.com/kakbga/Icon-backup/main/Qure/IconSet/Color/Apple.png
static=智能助理, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, 特殊节点, proxy, direct, img-url=https://raw.githubusercontent.com/kakbga/Icon-backup/main/Qure/IconSet/Color/ChatGPT.png
static=港台番剧, 香港节点, 台湾节点, direct, img-url=https://raw.githubusercontent.com/kakbga/Icon-backup/main/Orz-3/Color/StreamingSE.png
